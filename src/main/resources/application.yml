server:
  shutdown: graceful
  port: 8081
  servlet:
    context-path: /api
  error:
    include-message: always

spring:
  jackson:
    mapper:
      ACCEPT_CASE_INSENSITIVE_ENUMS: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/access}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 30000
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_URL:http://0.0.0.0:8080}/realms/access
  jpa:
    properties:
      hibernate:
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 250

llm:
  service:
    batch-size: 10
    url: ${CLUSTER_URL:http://localhost:4000}

examples:
  grace-period: ${GRACE_PERIOD:5}
  example-queue:
    cpu-threshold: ${CPU_THRESHOLD:0.70}
    max-concurrent-submissions: ${MAX_CONCURRENT_SUBMISSIONS:20}

logging:
  level:
    org.springframework:
      web.filter.CommonsRequestLoggingFilter: debug
    ch.uzh.ifi.access: debug
    org.flywaydb: debug

caching:
  eviction-rate: ${CACHE_EVICTION_RATE:15m}

docker:
  pool:
    enabled: ${DOCKER_POOL_ENABLED:false}
    image: ${DOCKER_POOL_IMAGE:}
    size: ${DOCKER_POOL_SIZE:8}
    maxReuse: ${DOCKER_POOL_MAX_REUSE:100}
    borrowTimeoutSeconds: ${DOCKER_POOL_BORROW_TIMEOUT_SECONDS:30}
    # Non-root user student workloads run as inside pooled containers (docker --user syntax).
    user: "${DOCKER_POOL_USER:1000:1000}"
    # How often the reaper checks idle containers for liveness and refills the pool.
    healthCheckRate: ${DOCKER_POOL_HEALTH_CHECK_RATE:30s}
    # Read-only container root filesystem; only the tmpfs mounts and /submission stay writable.
    readOnlyRootfs: ${DOCKER_POOL_READONLY_ROOTFS:true}
    # Max processes per container (fork-bomb guard).
    pidsLimit: ${DOCKER_POOL_PIDS_LIMIT:256}
    # Per-container CPU ceiling in cores (CFS quota).
    cpuLimit: ${DOCKER_POOL_CPU_LIMIT:2.0}
